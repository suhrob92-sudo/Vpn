[project]
name = "vpn-bot"
version = "1.0.0"
description = "VPN platform Telegram bot"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.7",
    "httpx>=0.27",
    "pydantic-settings>=2.3",
    "qrcode[pil]>=7.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bot*"]
